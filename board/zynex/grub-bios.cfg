set default="0"
set timeout="5"

menuentry "Zynex starten" {
	linux /boot/bzImage root=PARTUUID=5a594e58-01 rootwait console=ttyS0,115200 console=tty1
}

menuentry "Zynex auf diesen Computer installieren" {
	linux /boot/bzImage root=PARTUUID=5a594e58-01 rootwait console=ttyS0,115200 console=tty1 zynex.install=1
}
