name: zynexos-llm
# Prueft den Zynex-LLM-Motor: (1) gegen eine unabhaengige numpy-Rechnung (Testmodell), (2) mit echten Qwen2.5-Modellen (Antwort muss stimmen)
on:
  workflow_dispatch:
  push:
    paths: ["zynexos/kernel/llm.c", "zynexos/include/llm.h", "tools/llm_host.c", "tools/llm_test_gguf.py", ".github/workflows/zynexos-llm.yml"]
jobs:
  llm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        modell: ["Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q8_0.gguf", "Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q8_0.gguf"]
    steps:
      - uses: actions/checkout@v4
      - name: Motor bauen
        run: gcc -O3 -fno-math-errno -Izynexos/include -o llm_host tools/llm_host.c zynexos/kernel/llm.c -lm
      - name: Test gegen Referenz (Testmodell)
        run: pip install numpy >/dev/null && python3 tools/llm_test_gguf.py ./llm_host
      - name: Echtes Modell laden
        run: curl -L --retry 5 -f -o modell.gguf "https://huggingface.co/Qwen/${{ matrix.modell }}" && ls -la modell.gguf
      - name: Fragen stellen
        run: |
          ./llm_host modell.gguf chat "Was ist die Hauptstadt von Frankreich? Antworte kurz." 40 | tee a1.txt
          ./llm_host modell.gguf chat "What is 7 times 6? Answer with just the number." 12 | tee a2.txt
          grep -q "42" a2.txt
          if echo "${{ matrix.modell }}" | grep -q 3B; then grep -q "Paris" a1.txt; fi
