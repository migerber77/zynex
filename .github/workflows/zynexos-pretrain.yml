name: zynexos-pretrain
# Vortraining des Zynex-Netzes: holt ein Textkorpus (Gutenberg + Wikipedia), trainiert und legt zynexos/kernel/nn_start.bin ab.
on:
  workflow_dispatch:
    inputs:
      minuten:
        description: "Trainingszeit in Minuten"
        default: "60"
      lr0:
        description: "Lernrate am Anfang (Tausendstel)"
        default: "4"
      lr1:
        description: "Lernrate am Ende (Tausendstel)"
        default: "1"
      weiter:
        description: "1 = vom eingecheckten Startmodell weitertrainieren, 0 = von vorn"
        default: "0"
      wiki:
        description: "Anzahl Wikipedia-Abrufe (je 20 Artikel)"
        default: "700"
permissions:
  contents: write
jobs:
  vortraining:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Korpus holen
        run: |
          timeout 2100 python3 -u tools/nn_korpus.py /tmp/korpus.txt "${{ inputs.wiki }}" || echo "Korpus-Zeitlimit, nehme den Zwischenstand"
          test $(stat -c %s /tmp/korpus.txt) -gt 1500000 || { echo "Korpus zu klein (unter 1,5 MB), Abbruch"; exit 1; }
      - name: Trainer bauen
        run: gcc -O3 -march=native -ffast-math -DNN_OHNE_START=${{ inputs.weiter == '1' && '0' || '1' }} -Wa,-Izynexos -Izynexos/include -o /tmp/pre tools/nn_pretrain.c zynexos/kernel/nn.c -lm
      - name: Trainieren
        run: /tmp/pre /tmp/korpus.txt /tmp/nn_start.bin $(( ${{ inputs.minuten }} * 60 )) ${{ inputs.lr0 }} ${{ inputs.lr1 }} | tee /tmp/train.log | grep -E "Korpus|Durchgang|Bestes|geschrieben"
      - name: Modell als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nn-start-modell
          path: |
            /tmp/nn_start.bin
            /tmp/train.log
          if-no-files-found: warn
      - name: Startmodell einchecken
        run: |
          cp /tmp/nn_start.bin zynexos/kernel/nn_start.bin
          git config user.name "zynex-bot"; git config user.email "bot@zynex.invalid"
          git add zynexos/kernel/nn_start.bin
          git commit -m "Startmodell fuer das Netz vortrainiert ($(grep 'Bestes Modell' /tmp/train.log | tail -1))" || exit 0
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          echo "Push fehlgeschlagen - das Modell liegt als Artefakt nn-start-modell vor"; exit 1
