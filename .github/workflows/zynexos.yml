name: zynexos
on:
  workflow_dispatch:
  push:
    paths: ["zynexos/**", "tools/sb-schluessel.sh", "tools/zynexos_test.py", "tools/zynexos_build.sh", "tools/mk-*.sh", "tools/mkpack.py", "tools/pqsign.py", ".github/workflows/zynexos.yml"]
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y nasm gcc clang lld xorriso mtools gdisk dosfstools qemu-system-x86 qemu-utils ovmf sbsigntool >/dev/null && sudo pip3 install --break-system-packages virt-firmware pillow >/dev/null
      - name: Bauen (Kernel, UEFI-Lader, Signaturen, Pakete, ISOs)
        env:
          ZYNEX_SB_KEY: ${{ secrets.ZYNEX_SB_KEY }}
          ZYNEX_SB_CERT: ${{ secrets.ZYNEX_SB_CERT }}
        run: tools/zynexos_build.sh
      - name: Test Lader und Signatur (schnell)
        run: |
          python3 tools/zynexos_test.py zynexos-test.iso uefi boot
          python3 tools/zynexos_test.py zynexos-os.iso uefi stick
          python3 tools/zynexos_test.py zynexos-test.iso uefi browser
          python3 tools/zynexos_test.py zynexos-manip.iso uefi manip
      - name: Test UEFI Secure Boot
        run: python3 tools/zynexos_test.py zynexos-test.iso uefi sicherboot
      - name: Test Audio (Intel HD Audio)
        run: python3 tools/zynexos_test.py zynexos-test.iso uefi audio
      - name: Test USB-Audio
        run: python3 tools/zynexos_test.py zynexos-test.iso uefi usbaudio
      - name: Test UEFI
        run: |
          python3 tools/zynexos_test.py zynexos-test.iso uefi basis platte sata virtio vgpu usb layout netz installer usbnet ps2
          ZYNEX_GUI_ISO=zynexos-os.iso python3 tools/zynexos_test.py zynexos-test.iso uefi grafik
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('zynex-sb.cer') != ''
        with:
          name: zynex-secureboot-zertifikat
          path: |
            zynex-sb.cer
            zynex-sb.crt
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('zynexos-os.iso') != ''
        with:
          name: zynexos-iso
          path: zynexos-os.iso
          compression-level: 0
