name: zynexos
on:
  workflow_dispatch:
  push:
    paths: ["zynexos/**", "tools/zynexos_test.py", "tools/zynexos_build.sh", "tools/mk-*.sh", "tools/mkpack.py", "tools/pqsign.py", ".github/workflows/zynexos.yml"]
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y nasm gcc clang lld xorriso mtools gdisk dosfstools qemu-system-x86 qemu-utils ovmf >/dev/null
      - name: Kleines Sprachmodell holen (Test)
        run: curl -L --retry 5 -f -o qwen-klein.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q8_0.gguf
      - name: Bauen (Kernel, UEFI-Lader, Signaturen, Pakete, ISOs)
        run: ZYNEX_MODELL=qwen-klein.gguf tools/zynexos_build.sh
      - name: Test Lader und Signatur (schnell)
        run: |
          python3 tools/zynexos_test.py zynexos-test.iso uefi boot
          python3 tools/zynexos_test.py zynexos-manip.iso uefi manip
      - name: Test Sprachmodell im Kernel
        run: |
          gcc -O2 -fno-math-errno -Izynexos/include -o llm_host tools/llm_host.c zynexos/kernel/llm.c -lm
          ZYNEX_LLM_HOST=$PWD/llm_host ZYNEX_MODELL=qwen-klein.gguf ZYNEX_MEM=2048M python3 tools/zynexos_test.py zynexos-ki.iso uefi ki kiinstall
      - name: Test UEFI
        run: |
          python3 tools/zynexos_test.py zynexos-test.iso uefi basis platte sata usb layout netz installer usbnet ps2
          ZYNEX_GUI_ISO=zynexos-os.iso python3 tools/zynexos_test.py zynexos-test.iso uefi grafik
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('zynexos-os.iso') != ''
        with:
          name: zynexos-iso
          path: zynexos-os.iso
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('zynexos-os-ki.iso') != ''
        with:
          name: zynexos-iso-mit-ki
          path: zynexos-os-ki.iso
          compression-level: 0
