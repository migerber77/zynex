name: zynexos
on:
  workflow_dispatch:
    inputs:
      modell:
        description: "Sprachmodell in zynexos-os-ki.iso (1.5b = Standard, deutlich genauer; 0.5b = klein und schnell)"
        type: choice
        options: ["1.5b", "0.5b"]
        default: "1.5b"
  push:
    paths: ["zynexos/**", "tools/sb-schluessel.sh", "tools/zynexos_test.py", "tools/zynexos_build.sh", "tools/mk-*.sh", "tools/mkpack.py", "tools/pqsign.py", ".github/workflows/zynexos.yml"]
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y nasm gcc clang lld xorriso mtools gdisk dosfstools qemu-system-x86 qemu-utils ovmf sbsigntool >/dev/null && sudo pip3 install --break-system-packages virt-firmware pillow >/dev/null
      - name: Sprachmodelle holen (klein fuer die Tests, gross fuer die ISO)
        run: |
          curl -L --retry 5 -f -o qwen-klein.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q8_0.gguf
          if [ "${{ github.event.inputs.modell }}" = "0.5b" ]; then cp qwen-klein.gguf qwen-iso.gguf
          else curl -L --retry 5 -f -o qwen-iso.gguf https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q8_0.gguf; fi
          ls -la *.gguf
      - name: Bauen (Kernel, UEFI-Lader, Signaturen, Pakete, ISOs)
        env:
          ZYNEX_SB_KEY: ${{ secrets.ZYNEX_SB_KEY }}
          ZYNEX_SB_CERT: ${{ secrets.ZYNEX_SB_CERT }}
        run: ZYNEX_MODELL=qwen-klein.gguf ZYNEX_MODELL_ISO=qwen-iso.gguf tools/zynexos_build.sh
      - name: Test Lader und Signatur (schnell)
        run: |
          python3 tools/zynexos_test.py zynexos-test.iso uefi boot
          python3 tools/zynexos_test.py zynexos-os.iso uefi stick
          python3 tools/zynexos_test.py zynexos-test.iso uefi browser
          python3 tools/zynexos_test.py zynexos-manip.iso uefi manip
      - name: Test UEFI Secure Boot
        run: python3 tools/zynexos_test.py zynexos-test.iso uefi sicherboot
      - name: Test Audio (Intel HD Audio)
        run: python3 tools/zynexos_test.py zynexos-test.iso uefi audio
      - name: Test USB-Audio
        run: python3 tools/zynexos_test.py zynexos-test.iso uefi usbaudio
      - name: Test Sprachmodell im Kernel
        run: |
          gcc -O2 -fno-math-errno -Izynexos/include -o llm_host tools/llm_host.c zynexos/kernel/llm.c -lm
          echo "== Grosses Modell (ISO) mit der Kernel-Engine =="
          ./llm_host qwen-iso.gguf chat "Antworte kurz auf Deutsch. Was ist die Hauptstadt von Italien?" 60 | tee grosses-modell.txt
          ./llm_host qwen-iso.gguf chat "Antworte kurz auf Deutsch. Wie viel ist 17 mal 3?" 60 | tee -a grosses-modell.txt
          grep -q "Rom" grosses-modell.txt
          ZYNEX_LLM_HOST=$PWD/llm_host ZYNEX_MODELL=qwen-klein.gguf ZYNEX_MEM=2048M python3 tools/zynexos_test.py zynexos-ki.iso uefi ki kiinstall
      - name: Test UEFI
        run: |
          python3 tools/zynexos_test.py zynexos-test.iso uefi basis platte sata virtio usb layout netz installer usbnet ps2
          ZYNEX_GUI_ISO=zynexos-os.iso python3 tools/zynexos_test.py zynexos-test.iso uefi grafik
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('zynex-sb.cer') != ''
        with:
          name: zynex-secureboot-zertifikat
          path: |
            zynex-sb.cer
            zynex-sb.crt
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('zynexos-os.iso') != ''
        with:
          name: zynexos-iso
          path: zynexos-os.iso
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('zynexos-os-ki.iso') != ''
        with:
          name: zynexos-iso-mit-ki
          path: zynexos-os-ki.iso
          compression-level: 0
